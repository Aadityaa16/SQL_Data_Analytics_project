}

  height: 0;
}
:root {

}

  fill: var(--p);

}
.box {
  fill: var(--bg2);
  stroke: var(--b);
}
.arr {

  fill: none;
  stroke-width: 1.5;
}

}

select {

input[type="range"] {

<svg width="100%" viewBox="0 0 680 120" role="img">
<title>Data analytics roadmap, animated</title>
<desc>A horizontal timeline of 12 steps, each paired with a photo icon from the original hand-drawn diagram, that highlights one at a time: exploratory data analysis steps in blue, advanced analytics steps in green.</desc>

<g class="step" id="step-4"><circle class="ring" cx="258.2" cy="70" r="14" fill="none" stroke="#378ADD" stroke-width="2"></circle><circle class="c-blue" cx="258.2" cy="70" r="7" stroke-width="0.5"></circle><text class="ts" x="258.2" y="100" text-anchor="middle">5</text></g>
<g class="step" id="step-5"><circle class="ring" cx="312.7" cy="70" r="14" fill="none" stroke="#378ADD" stroke-width="2"></circle><circle class="c-blue" cx="312.7" cy="70" r="7" stroke-width="0.5"></circle><text class="ts" x="312.7" y="100" text-anchor="middle">6</text></g>

<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:0.75rem 0;">
<button id="prevBtn" aria-label="Previous step"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
<button id="playBtn" aria-label="Play"><i id="playIcon" class="ti ti-player-play" aria-hidden="true"></i></button>
<button id="nextBtn" aria-label="Next step"><i class="ti ti-arrow-right" aria-hidden="true"></i></button>
</div>
<div style="text-align:center;" aria-live="polite">
<span id="phaseBadge" style="font-size:12px;padding:3px 10px;border-radius:var(--radius);"></span>
<p id="stepName" style="font-size:16px;font-weight:500;margin:6px 0 0;color:var(--text-primary);"></p>
</div>
<script>
const steps=[
{name:"Database exploration",phase:"eda"},
{name:"Dimensions exploration",phase:"eda"},
{name:"Date exploration",phase:"eda"},
{name:"Measures exploration",phase:"eda"},
{name:"Magnitude",phase:"eda"},
{name:"Ranking (top-bottom N)",phase:"eda"},
{name:"Change over time",phase:"adv"},
{name:"Cumulative analysis",phase:"adv"},
{name:"Performance analysis",phase:"adv"},
{name:"Part-to-whole",phase:"adv"},
{name:"Data segmentation",phase:"adv"},
{name:"Reporting",phase:"adv"}
];
const cx=[40,94.5,149.1,203.6,258.2,312.7,367.3,421.8,476.4,530.9,585.5,640];
let step=0,playing=false,timer=null;
const playIcon=document.getElementById('playIcon');
const playBtn=document.getElementById('playBtn');
const badge=document.getElementById('phaseBadge');
const nameEl=document.getElementById('stepName');
const progressLine=document.getElementById('progressLine');
function render(){
for(let i=0;i<12;i++){
document.getElementById('step-'+i).classList.toggle('active',i===step);
document.getElementById('icon-'+i).classList.toggle('active',i===step);
}
progressLine.setAttribute('x2',cx[step]);
const s=steps[step];
nameEl.textContent=(step+1)+'. '+s.name;
if(s.phase==='eda'){badge.textContent='Exploratory data analysis';badge.style.background='var(--bg-accent)';badge.style.color='var(--text-accent)';}
else{badge.textContent='Advanced analytics';badge.style.background='#EAF3DE';badge.style.color='#27500A';}
}
function stopPlay(){playing=false;clearInterval(timer);playIcon.className='ti ti-player-play';playBtn.setAttribute('aria-label','Play');}
function goTo(i){step=Math.max(0,Math.min(11,i));render();}
document.getElementById('prevBtn').addEventListener('click',()=>{stopPlay();goTo(step-1);});
document.getElementById('nextBtn').addEventListener('click',()=>{stopPlay();goTo(step+1);});
playBtn.addEventListener('click',()=>{
playing=!playing;
if(playing){playIcon.className='ti ti-player-pause';playBtn.setAttribute('aria-label','Pause');timer=setInterval(()=>{step=(step+1)%12;render();},1800);}
else{stopPlay();}
});
render();
</script>
</div></body></html>
